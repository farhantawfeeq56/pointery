name: Task
description: A bug, an idea, a piece of work or a decision
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Leave out pricing, business plans and customer names.
        Don't report an unfixed security hole here.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or reason. One line is enough.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How you will know it is finished.
  - type: textarea
    id: notes
    attributes:
      label: Notes
